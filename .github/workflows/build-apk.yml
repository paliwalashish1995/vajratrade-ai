name: Build VajraTrade AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Capacitor Native Wrapper
        run: |
          mkdir -p android-wrapper/www
          echo "<h1>Loading VajraTrade AI...</h1>" > android-wrapper/www/index.html
          cd android-wrapper
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "VajraTrade AI" "com.vajratrade.ai" --web-dir www
          npx cap add android
          node -e '
            const fs = require("fs");
            const cfg = {
              appId: "com.vajratrade.ai",
              appName: "VajraTrade AI",
              webDir: "www",
              server: {
                url: "https://vajratrade-ai.onrender.com",
                cleartext: true,
                allowNavigation: ["*"]
              }
            };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android-wrapper/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VajraTrade-AI-APK
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
