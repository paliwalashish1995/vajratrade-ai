name: Build VajraTrade AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Capacitor WebView App
        run: |
          mkdir -p android-wrapper/www
          printf '<!DOCTYPE html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>VajraTrade AI</title><script>window.location.replace("https://vajratrade-ai.onrender.com");</script></head><body><p>Loading VajraTrade AI...</p></body></html>' > android-wrapper/www/index.html
          cd android-wrapper
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "VajraTrade AI" "com.vajratrade.ai" --web-dir www
          npx cap add android

      - name: Build Debug APK
        run: |
          cd android-wrapper/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VajraTrade-AI-APK
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
